#
# Conversion schema—settings that describe one rendering of the book.
#
# Ships with the conversion tools. The packaging half never reads this
# file, so a setting added here touches nothing packaging depends on.
#
# Everything below was reachable somehow before this schema existed: eight
# keys through the config file, and the rest only as environment variables
# documented in a Lua comment. Declaring them together is the point --
# a setting nobody can find is a setting nobody can use.

description: >
  How the book is rendered into one output format.

keys:

  format:
    type: enum
    values: [html, epub3, pdf, docx, markdown]
    default: html
    target_only: true
    stage: render
    description: >
      What this target produces.

  output_dir:
    type: path
    default: ""
    target_only: true
    default_from_target: true
    stage: render
    description: >
      Where this target writes. Defaults to the target's own name, so two
      targets in the same format can't overwrite each other.

  filename:
    type: path
    default: ""
    target_only: true
    stage: render
    description: >
      For a format that produces one file for the whole book, such as
      epub3, the file to write inside output_dir. Left empty it's worked
      out afresh on every run from the book's identifier and the format,
      so renaming the book renames the file. Given without an extension,
      the one matching the format is added.

  menu:
    type: enum
    values: ["on", "off"]
    default: "off"
    stage: render
    description: >
      Whether every page of an HTML target carries the book's contents as
      a menu at its top (collapsed, the current page marked) and links to
      the previous and next page at its foot. For posting the pages as a
      site of their own. Off by default, since an LMS gives the pages
      its own navigation and the EPUB has its reading system's. A page
      from the pass-through directory is left as it stands.

  title_block:
    type: enum
    values: ["on", "off"]
    default: "on"
    stage: render
    description: >
      Whether a page's own subtitle, date, abstract, and include-before
      render on it for this target. A source's opening page carries the
      document's, which makes it a title page; off leaves the author to
      lay the front matter out by hand.

  numbering:
    type: enum
    values: [project, "on", "off"]
    default: project
    stage: render
    description: >
      Whether this target shows the book's structure numbered (see
      project.numbering). project follows the book; on and off decide
      for this target alone, so an EPUB can carry chapter numbers while
      a web edition doesn't, or the reverse. The cartridge follows the
      book's setting.

  header:
    type: text
    default: ""
    stage: render
    description: >
      Markdown placed at the top of every page, or the path to a file
      holding it. Inserted by the template after the filters have run, so
      nothing in it's processed: give any image explicit alt text.

  footer:
    type: text
    default: ""
    stage: render
    description: >
      Markdown placed at the bottom of every page, or the path to a file
      holding it. The usual use is an attribution line. Same caveat as
      header: it isn't processed by the filters.

  promote_h1_to_title:
    type: enum
    values: [always, if-absent, longer, never]
    default: always
    description: >
      Whether a page's leading H1 becomes its title. Reading .docx, the
      existing title comes from a paragraph styled Title, which Pandoc's
      reader consumes out of the body as metadata. In the OpenStax books
      that paragraph says the same thing as the H1 without its section
      number, so the H1 is the more complete of the two and always is
      right. Reading Markdown or HTML a title is deliberate, so if-absent
      is. longer promotes only when the H1 contains the existing title;
      never leaves both alone.

  author_byline:
    type: enum
    values: [meta, visible, drop]
    default: meta
    description: >
      What to do with author metadata from the source. Reading .docx this
      comes from a paragraph styled Author, which Pandoc consumes out of
      the body the same way it consumes a Title-styled one. meta keeps it
      in the page head and suppresses the visible byline Pandoc's template
      would otherwise print under every title; visible keeps both; drop
      removes it.

  images:
    description: >
      How images extracted from the source are handled.
    keys:

      spacer_below:
        type: float
        default: 0
        description: >
          Width in inches below which an image is treated as a layout
          spacer rather than content. 0 disables the rule and reports
          candidates instead.

      strip_spacer:
        type: bool
        default: false
        description: >
          Remove spacer images rather than hiding them from assistive
          technology.

      alt_max_chars:
        type: int
        default: 120
        description: >
          Alt text longer than this is reported so it can be shortened,
          with the detail moved into the surrounding prose where every
          reader benefits from it.

      responsive:
        type: bool
        default: true
        description: >
          Let images shrink on narrow viewports rather than reproducing
          the source's fixed dimensions (WCAG 1.4.10).

  tables:
    description: >
      How data tables are rendered.
    keys:

      bands:
        type: enum
        values: [auto, split, group]
        default: auto
        stage: filter
        description: >
          What a table whose rows are grouped under bands becomes: a merged
          row across the table labeling the rows beneath it, as in a Word
          table, or a tbody headed by one in HTML. split makes one table
          per band, the band's text in each part's caption, which is what
          a screen reader announces (NVDA, tested in Chrome and Firefox,
          names none of the ways HTML marks a row group). group keeps one
          table with a body per band, each band a row-group header, which
          is the author's form and reads back as it was written. auto
          derives from the target's format: split for html, epub3, and
          pdf; group for markdown and docx, whose output becomes a source.

      wrap:
        type: bool
        default: true
        description: >
          Put wide tables in a focusable scroll container so a long table
          doesn't force the whole page to scroll sideways (WCAG 1.4.10).

      markers:
        type: opaque
        default: {matrix: both, row-headers: first-column}
        description: >
          What a fenced div around a table in a Markdown source declares
          about its headers, class by class: "::: matrix" means both a
          header row and a header column, "::: row-headers" a header
          column and no header row, unless this says otherwise. The
          values are the ones table-headers.csv takes (first-row,
          first-column, both, none); a header row alone and no headers
          need no marker, since a pipe or grid table says those itself.
          A Markdown target writes these markers back. A Markdown table
          with no marker is left as Pandoc read it; the guess and the
          report run only on Word sources.

  pages:
    description: >
      What a page is, when the source's files are not already the pages
      you want.
    keys:

      split_level:
        type: int
        default: 0
        description: >
          Cut every source into one page per heading of this level or
          shallower, after the filter has run and before anything is
          rendered. 0 leaves each file as one page. A book that arrived
          as one file per chapter gets one page per section with 2, and
          the packager groups the pieces under their source without
          being told. Each piece is named after its heading unless the
          page_names sidecar says otherwise, its heading becomes its
          title, and links between pieces are rewritten to follow.

  links:
    stage: filter
    description: >
      What happens to links on the way through.
    keys:

      rewrite_publisher:
        type: bool
        default: true
        stage: filter
        description: >
          A link to a page of this book on the publisher's site --
          https://openstax.org/books/<book>/pages/<page>#anchor, the shape
          OpenStax's export uses for its index and its cross-references --
          becomes a link to the page here, anchor and all, when the book
          has that page. A link to a page the book doesn't have is left
          as it is.

  merge:
    type: enum
    values: [off, groups]
    stage: render
    default: off
    description: >
      For a markdown target: off writes one file per page, as the rest
      of the run sees pages. groups writes one file per top-level entry
      of the book's contents, with each page under it as a section, so
      a book whose sources are one file per section comes back as one
      file per chapter. Links between merged pages become links inside
      the file, and links to a page in another file name that file.

  notes:
    stage: render
    description: >
      Where footnotes go and how they count, once a source has been cut
      into pages. Pandoc numbers them per page and keeps each page's at
      its end; these settings rearrange that in the rendered pages and in
      the EPUB alike.
    keys:

      numbering:
        type: enum
        values: [page, group]
        default: page
        description: >
          page restarts the numbers on every page. group continues them
          across the pages of the enclosing group, in reading order,
          whatever a group is called; a page that was not split is a
          group of one.

      placement:
        type: enum
        values: [page, group, book]
        default: page
        description: >
          page keeps each page's notes at its end. group gathers a
          group's notes at the end of its last page. book gathers every
          note on one Notes page at the end, with a heading for each
          group, numbered per group. A reference always links to its
          note wherever it went, and the note links back.

  epub:
    stage: package
    description: >
      Settings read only by an epub3 target. One EPUB holds the whole
      book: every page in project.contents, in that order, with each
      group a heading over its pages and the table of contents built
      from the same tree the cartridge organization uses.
    keys:

      toc_depth:
        type: int
        default: 2
        description: >
          How many levels the table of contents shows. A group at the top
          of project.contents is level 1, a page inside it level 2, and a
          page's own headings continue below its entry, so 2 shows the
          groups and their pages, whatever a group is called. The depth is a rank in the book, not a
          fact about the file a heading came from, so a book assembled
          from files split at different depths still reads evenly.

      cover_image:
        type: path
        default: ""
        description: >
          An image for the cover page, JPEG or PNG, as an absolute path
          or one relative to the content directory. Left empty the book
          has no cover page. A path that doesn't exist stops the build.

      cover_alt:
        type: string
        default: ""
        description: >
          What a screen reader says for the cover image. Left empty it
          is "Cover of" followed by the book's title, which is what a
          cover usually is; give the text when the picture says more.

      accessibility_summary:
        type: text
        default: ""
        description: >
          The sentence or two a reading system shows a reader about the
          book's accessibility, alongside the claims the run computes for
          itself (see the docs). Left empty it's derived from what this
          run found: how many images lack alternative text, whether
          equations are MathML, and so on, so it stays true as the
          sidecars are filled in.

  captions:
    description: >
      How table and figure labels are recognized in the source.
    keys:

      table_prefixes:
        type: list
        item: string
        default: [Table]
        description: >
          Words that begin a table label. Books that say Exhibit rather
          than Table need this.

      figure_prefixes:
        type: list
        item: string
        default: [Figure]
        description: >
          Words that begin a figure label.

  media:
    description: >
      How media extracted from the source is handled.
    keys:

      strict:
        type: bool
        default: false
        description: >
          Abort as soon as an image can't be identified, rather than
          collecting every such image and stopping once at the gate.

  sidecars:
    description: >
      CSV files holding decisions a person made about the source. These
      describe the book rather than one rendering, so a target should
      rarely override them.

      These files are read, never written, and hold work no script can
      reproduce. A bare name resolves against the content directory,
      which is convenient but leaves them among the generated HTML, the
      extracted media, and the disposable reports: the directory you
      would delete to rebuild, and the one replaced wholesale when the
      publisher reissues the source. An absolute path, or one relative
      to the content directory such as
      "../corrections/ibs2e/table-captions.csv", keeps them somewhere
      you can put under version control. A path set here that doesn't
      exist stops the run, because the alternative is converting the
      whole book while silently discarding every correction in it.
    keys:

      table_captions:
        type: path
        default: table-captions.csv
        description: >
          Descriptive captions, keyed on the table's label. A bare label
          is a valid caption but describes nothing, and no script can
          invent the description.

      image_alt:
        type: path
        default: image-alt.csv
        description: >
          Alt text, keyed on the image path with the extension ignored.
          Use [decorative] for an image that carries no meaning.

      table_headers:
        type: path
        default: table-headers.csv
        description: >
          Where each table's headers are, keyed on a hash of the table's
          content: first-row, first-column, both, or none. A first run
          writes prefilled rows to the table_headers_new report; rename
          or paste them here. Values this version doesn't act on yet
          (manual, list) are accepted and kept. A row whose key matches
          no table stops the run, because a correction that silently
          fails to apply destroys work invisibly.

      page_names:
        type: path
        default: page-names.csv
        description: >
          Names for the pages split_level cuts, keyed on the source and
          the heading text: source, heading, name. Only needed when the
          name derived from the heading is not the one you want. A row
          whose source and heading match nothing is reported, since it
          means a heading was edited or the row was mistyped.

  reports:
    stage: report
    description: >
      Where the run records what still needs human attention. Removing a
      report when nothing is outstanding is deliberate: the file existing
      at all is the signal that there's work to do.
    keys:

      table_captions_missing:
        type: path
        default: table-captions-missing.csv
        description: >
          Tables whose caption is a bare label with no description.

      image_alt_missing:
        type: path
        default: image-alt-missing.csv
        description: >
          Images with no alt text, or with alt text over the length limit.

      table_headers_new:
        type: path
        default: table-headers-new.csv
        description: >
          Prefilled sidecar rows for every data table the table_headers
          sidecar has no row for, in the sidecar's own format. Written
          when there are any and removed when there are none, so the file
          existing is the signal that there are rows to paste in.

      table_headers_report:
        type: path
        default: table-headers-report.csv
        description: >
          What happened to every data table this run: what the sidecar
          declared, what the guess said and why, and a status of
          declared, new, blank, manual, needs-source, or unmatched.

      page_names_new:
        type: path
        default: page-names-new.csv
        description: >
          Prefilled page_names rows for every page split_level cut that
          the sidecar has no row for, with the derived name filled in.
          Written when there are any and removed when there are none.

      page_names_report:
        type: path
        default: page-names-report.csv
        description: >
          Every page split_level wrote this run: its source, the heading
          it was cut at, its name, and which part of how many it is.

      output_check:
        type: path
        default: output-check.csv
        description: >
          What the output check found wrong with the pages and any EPUB
          this run wrote: links and fragments that resolve to nothing,
          images with no alt attribute, headings that skip a level,
          duplicate ids, tables with neither header cells nor a caption,
          pages with no language or title. Written when there are any
          findings and removed when there are none. The run isn't
          stopped by them; they're a list to work through.

      media_unresolved:
        type: path
        default: media-unresolved.csv
        description: >
          Media that could not be identified. EMF and WMF are the usual
          cause and have to go back to the author.

      spacer_images:
        type: path
        default: spacer-images.csv
        description: >
          Spacer images found, and what was done with each.
